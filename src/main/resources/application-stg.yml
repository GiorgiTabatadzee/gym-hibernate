# Staging: real PostgreSQL instance. Schema is expected to be already migrated ("validate", never
# "update"/"create") and credentials come from the environment, never hardcoded.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:stg-db.internal}:${DB_PORT:5432}/${DB_NAME:gymdb_stg}
    username: ${DB_USERNAME:gym_stg}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

app:
  hibernate:
    dialect: org.hibernate.dialect.PostgreSQLDialect
    ddl-auto: validate
    show-sql: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    com.epam.gym: INFO
    org.hibernate: WARN
