# Production: real PostgreSQL instance, no auto-DDL, credentials mandatory from the environment
# (no defaults — fail fast at startup rather than silently connect with a placeholder), tighter
# logging, and a minimal actuator surface (no /env, /beans, etc. exposed).
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20

app:
  hibernate:
    dialect: org.hibernate.dialect.PostgreSQLDialect
    ddl-auto: validate
    show-sql: false

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: WARN
    com.epam.gym: INFO
