# Profile used by @SpringBootTest(webEnvironment = RANDOM_PORT) full-context tests: isolated,
# fresh in-memory H2 per JVM run, schema created from the entities directly.
spring:
  datasource:
    url: jdbc:h2:mem:gymtestdb-context;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

app:
  hibernate:
    dialect: org.hibernate.dialect.H2Dialect
    ddl-auto: create-drop
    show-sql: false

management:
  endpoints:
    web:
      exposure:
        include: "*"
