# Local developer machine: file-based H2, schema auto-managed, verbose SQL logging.
spring:
  datasource:
    url: jdbc:h2:file:./data/gymdb-local;AUTO_SERVER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

app:
  hibernate:
    dialect: org.hibernate.dialect.H2Dialect
    ddl-auto: update
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    com.epam.gym: DEBUG
